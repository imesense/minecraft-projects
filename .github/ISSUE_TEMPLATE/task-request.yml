# yaml-language-server: $schema=https://json.schemastore.org/github-issue-forms.json

name: Task request
description: Suggest task for complete.
labels:
    - "task"

body:
    # Task information
    - type: textarea
      id: formulation
      attributes:
          label: Formulation
          description: >
              Description of task to complete.
    - type: textarea
      id: solution
      attributes:
          label: Solution
          description: >
              Description of what want to happen.
    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives
          description: >
              Description of any alternative solutions or features.

    # Options
    - type: textarea
      id: additional
      attributes:
          label: Additional context
          description: >
              Add any other context or screenshots about the task request.

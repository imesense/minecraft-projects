# yaml-language-server: $schema=https://json.schemastore.org/github-issue-forms.json

name: Bug report
description: Create bug report.
labels:
    - "bug"

body:
    # Bug information
    - type: textarea
      id: version
      attributes:
          label: Version
          description: >
              Fields to create a complete report.
          placeholder: |
              - Computer characteristics.
              - Operating system
              - Project version
      validations:
          required: true
    - type: textarea
      id: description
      attributes:
          label: Description
          description: >
              Description of what the bug is.
      validations:
          required: true
    - type: textarea
      id: reproduction
      attributes:
          label: Reproduction
          description: >
              Steps to reproduce the behavior.
          placeholder: |
              - Go to '...'.
              - Click on '...'.
              - Scroll down to '...'.
              - See error.
      validations:
          required: true

    # Options
    - type: textarea
      id: expected-behavior
      attributes:
          label: Expected behavior
          description: >
              Description of what expected to happen.
    - type: textarea
      id: screenshots
      attributes:
          label: Screenshots
          description: >
              Add screenshots to help explain the bug.
    - type: textarea
      id: additional
      attributes:
          label: Additional context
          description: >
              Add any other context about the bug if it is necessary.
